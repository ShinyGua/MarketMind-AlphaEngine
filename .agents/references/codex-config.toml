# MarketMind-AlphaEngine — Codex CLI MCP server config
# ---------------------------------------------------------------------------
# Codex reads MCP servers from ~/.codex/config.toml (TOML), NOT Claude's
# .mcp.json. Copy the three [mcp_servers.*] tables below into your
# ~/.codex/config.toml so the mm-* skills' mcp__market-data / mcp__workspace /
# mcp__memory tools resolve. These are translated verbatim from .mcp.json.
#
# IMPORTANT:
#   * The command/args paths are RELATIVE to Codex's launch directory.
#     Launch `codex` from the repository root, or replace the relative paths
#     with absolute ones (e.g. /abs/path/to/MarketMind-AlphaEngine/.venv/bin/python3
#     and the matching absolute server-script paths).
#   * API keys come from the project `.env` (gitignored): the market-data server
#     self-loads it at startup (mcp/shared/dotenv.py). Do NOT put `${NEWSAPI_KEY}`
#     here — Codex does not expand `${VAR}` in env tables, so the literal would
#     poison os.environ and block the real `.env` value. Leave env empty.
#     Canonical name is NEWSAPI_KEY (NEWSAPI_API_KEY is accepted as an alias).
#   * NETWORK ACCESS: the `workspace-write` sandbox disables outbound network by
#     DEFAULT. Live data (NewsAPI/yfinance/FRED/SEC) requires the
#     [sandbox_workspace_write] block below; without it the desks fall back to
#     WebSearch/cache with DNS failures. The headless driver also sets this per-run
#     via `-c sandbox_workspace_write.network_access=true`.
# ---------------------------------------------------------------------------

# Allow the collection desks to reach the network under the workspace-write sandbox.
[sandbox_workspace_write]
network_access = true

[mcp_servers.market-data]
command = ".venv/bin/python3"
args = ["mcp/market_data_server.py"]
env = {}

[mcp_servers.workspace]
command = ".venv/bin/python3"
args = ["mcp/workspace_server.py"]
env = { WORKSPACES_DIR = "workspaces" }

[mcp_servers.memory]
command = ".venv/bin/python3"
args = ["mcp/memory_server.py"]
env = { MEMORY_DIR = "memory" }
