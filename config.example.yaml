# ============================================================
# MarketMind-AlphaEngine — Master Configuration
# Copy to config.yaml and customize per deployment
# ============================================================

# --- General ---
project_name: marketmind-alpha-engine
language: en                    # en | ch
run_mode: daily                 # daily | weekly

# --- Company Target (filled by /mm:init via web search) ---
company:
  ticker:                       # resolved by /mm:init
  name:                         # resolved by /mm:init
  exchange:                     # resolved by /mm:init
  market_profile:               # resolved by /mm:init (US | HK | CN | JP | UK | EU)
  sector_profile:               # resolved by /mm:init

# --- Workspace ---
workspace:
  base_dir: workspaces
  save_raw_content: true

# --- Data Sources (free-tier APIs) ---
data_sources:
  price:
    provider: yfinance          # yfinance (free)
    horizons:
      short:
        period: 5d
        interval: 1h
      medium:
        period: 3mo
        interval: 1d
      long:
        period: 2y
        interval: 1mo
    save_csv: true

  news:
    provider: newsapi           # newsapi free tier; falls back to web_search if no API key
    fallback: web_search        # use WebSearch tool when API key is unavailable
    api_key_env: NEWSAPI_KEY
    max_market_news: 10
    max_sector_news: 12
    max_company_news: 15
    lookback_hours_daily: 36
    lookback_days_weekly: 7
    dedup_similarity_threshold: 0.82

  filings:
    provider: sec_edgar         # SEC EDGAR (free, official)
    user_agent: "MarketMind/1.0 (contact@example.com)"
    max_filings: 5

  macro:
    provider: fred              # FRED API (free key) — collected by scripts/collect_macro_series.py
    api_key_env: FRED_API_KEY
    series:
      - CPIAUCSL                # CPI, all items (monthly index)
      - CPILFESL                # Core CPI (monthly index)
      - FEDFUNDS                # Effective Fed funds rate
      - DGS2                    # 2Y Treasury yield
      - DGS5                    # 5Y Treasury yield
      - DGS10                   # 10Y Treasury yield (feeds DCF risk-free rate)
      - DGS30                   # 30Y Treasury yield
      - DTWEXBGS                # Trade-weighted broad USD index
      - BAMLH0A0HYM2            # ICE BofA HY credit spread (OAS)
      - VIXCLS                  # VIX
    yf_proxies:                 # keyless self-degrade map (CPI/FedFunds/HY have no proxy → inputs_missing)
      DGS2: ^IRX                # 13-week bill — approximate, flagged data_quality: proxy
      DGS5: ^FVX
      DGS10: ^TNX
      DGS30: ^TYX
      DTWEXBGS: DX-Y.NYB
      VIXCLS: ^VIX
    lookback_months: 16         # >= 13 monthly CPI obs for YoY even during the pre-release window (CPI lags ~6wk) + 1y VIX percentile

# --- Macro Regime (scripts/compute_macro_regime.py thresholds) ---
# Deterministic classification written to shared market_context/{date}/indicators/macro_regime.json.
# The artifact is shared across same-day workspaces — keep these in the ROOT config only.
# Project rule: macro regime is CONTEXT for analysts and the risk overlay, never a
# deterministic BUY/HOLD/SELL trigger or conviction cap.
macro_regime:
  rate_stable_band: 0.0025      # |3m 10Y delta| below → "stable"
  curve_flat_band: 0.0025       # 0 <= 2s10s < band → "flat"
  vix_percentile_window: 252
  vix_labels: {calm: 0.30, normal: 0.70, elevated: 0.90}   # percentile cuts; above elevated → "stressed"
  hy_regime: {tight: 0.030, normal: 0.045, wide: 0.060}    # HY OAS cuts; above wide → "stressed"
  policy_band: 0.00125          # |3m fedfunds delta| below → "on_hold"
  usd_trend_band_pct: 2.0       # |3m % change| below → "stable"
  inflation_band: 0.002         # |3m-annualized − YoY| below → "stable"

  nasdaq:                       # public nasdaq.com data (US names only)
    enabled: true
    api_base: https://api.nasdaq.com   # unofficial JSON API, no key; falls back to WebSearch/WebFetch
    news_limit: 10

  web_research:                 # mm-web-research subagent (Claude WebSearch/WebFetch)
    enabled: true
    max_results: 12
    min_cards: 12               # evidence floor: if desk+web cards < this, run an extra query pass
    # source hierarchy: institutional/MCP > NewsAPI > NASDAQ (US) > general web search
    source_hierarchy: [mcp, newsapi, nasdaq, websearch]

# --- Shared Market Context ---
shared_market_context:
  indices:
    - SPY
    - QQQ
    - DIA
  macro_assets:
    - GLD                       # Gold
    - USO                       # Oil
    - BTC-USD
    - ^VIX

# --- Peers ---
peers:
  auto_select: true
  max_peers: 5

# --- Quant Module ---
quant:
  enabled: true
  indicators:
    - rsi_14
    - macd_12_26_9
    - sma_20
    - sma_50
    - ema_12
    - ema_26
    - atr_14
  return_windows: [1d, 5d, 1m, 3m]
  relative_strength: true
  event_window: true
  # 1h/4h timing block (scripts/intraday_timing.py — deterministic, driver-run).
  # TIMING-ONLY: frames staged entry/exit price zones and the risk overlay;
  # never a reason to flip a BUY/HOLD/SELL vote or change conviction.
  intraday:
    enabled: true
    period: 90d                 # yfinance 1h lookback (free tier allows ~730d)
    interval: 1h
    resample: 4h                # naive clock bins, not exchange-session aligned
    rsi_window: 14
    macd: [12, 26, 9]
    swing_pivot_window: 5       # bars each side to confirm a 4h pivot high/low

# --- Valuation (Scenario DCF + Comps) ---
# Computed in Stage 6 by mm-valuation-engine (valuation/run_valuation.py).
# Free-tier: inputs come from yfinance fundamentals collected by the company desk.
# Non-equity instruments (ETF/fund/index) are auto-skipped (applicable=false);
# sparse data degrades to confidence=low rather than failing.
valuation:
  enabled: true
  use_live_risk_free: true        # CAPM risk-free = live 10Y from shared macro_regime.json when available
  risk_free_rate: 0.042           # FALLBACK ONLY — used when no live 10Y (provenance: risk_free_source)
  equity_risk_premium: 0.05       # CAPM ERP — intentionally static in v1 (no reliable free live source)
  cost_of_debt: 0.05              # pre-tax — intentionally static in v1 (no free issuer-spread source)
  default_terminal_growth: 0.025  # Gordon-growth terminal rate (must be < WACC)
  projection_years: 5             # explicit FCFF projection horizon
  base_growth_fallback: 0.05      # used when revenue growth is missing/non-positive
  max_base_growth: 0.20           # legacy constant-growth cap (kept for compat)
  scenario_growth_delta: 0.03     # bull = base + delta, bear = base - delta
  sensitivity_dims: 5             # odd N for the WACC × terminal-growth grid
  dcf_min_wacc_spread: 0.015      # exclude DCF if WACC is too close to terminal growth
  fade_years: 10                  # two-stage DCF high-growth phase; growth fades to terminal
  max_initial_growth: 0.35        # default-tier cap on year-1 high-growth rate
  fragile_tv_fraction: 0.80       # downgrade DCF when terminal value exceeds this share of EV
  # --- deterministic, fundamentals-driven growth selection (select_growth) ---
  cagr_years: 3                   # revenue-CAGR window for growth selection
  growth_divergence_ratio: 2.0    # CAGR vs trailing ratio (both positive) → confidence downgrade
  growth_divergence_abs: 0.25     # |CAGR − trailing| when signs differ / ≤0 → downgrade
  weak_margin_threshold: 0.05     # operating margin below → growth haircut + confidence downgrade
  weak_margin_growth_haircut: 0.75  # growth multiplier when margins are weak
  mega_cap_threshold: 200000000000  # ≥ $200B → mega-cap maturity growth cap
  mega_cap_max_growth: 0.25       # growth ceiling for mega-caps
  small_cap_threshold: 2000000000   # ≤ $2B → small-cap tier
  small_cap_max_growth: 0.35      # default: no small-cap inflation unless raised

# --- Discussion (Multi-Round Panel) ---
# Phase 1: Independent memos (all analysts run in parallel)
# Phase 2: Discussion panel loop — every analyst files a structured view
#          (stance bullish|neutral|bearish + conviction) each round; the chair
#          tallies; a deterministic convergence grader
#          (eval/graders/discussion_convergence_grader.py) decides iterate-vs-exit
#          with a hard max_rounds cap. enabled:false → memos feed synthesis directly.
# Phase 3: Moderator synthesis (thesis_map.json + debate_summary.md)
discussion:
  enabled: true
  analyst_roles:                  # ranked by importance, uncomment to enable
    - company_analyst             # 1. fundamentals, events, catalysts
    - risk_analyst                # 2. bear case, failure conditions
    - market_analyst              # 3. macro context, alpha vs beta
    # - valuation_analyst         # 4. P/E, DCF, price target (uncomment to enable)
    # - technical_analyst         # 5. chart patterns, momentum signals (uncomment to enable)
    # - catalyst_analyst          # 6. event timing, earnings calendar (uncomment to enable)
  analyst_risk_profiles:          # asymmetric loss mandate per role (risk_averse | risk_neutral)
    risk_analyst: risk_averse     # penalizes drawdown 2x vs missed upside
    # all unlisted roles default to risk_neutral; do not add a risk_seeking profile
  panel:
    enabled: true
    min_rounds: 1                 # never exit before this many rounds
    max_rounds: 3                 # hard cap — auto-exit at the limit
    convergence_threshold: 0.70   # conviction-weighted stance agreement needed to exit early
    conviction_collapse_ratio: 0.75   # round-over-round total-conviction retention floor; below it an early "converged" exit is suppressed (fake consensus)
    stall_epsilon: 0.05           # |Δ convergence_score| below this (and below threshold) = stalled → exit with unresolved_dissent
    devils_advocate_round: true   # round-1 perfect unanimity holds the panel one round; lowest-conviction role steelmans the opposing case
  require_thesis_map: true

# --- Review ---
review:
  enabled: true
  max_revision_loops: 3
  dimensions:
    - factuality
    - evidence_coverage
    - decision_quality
  min_overall_score: 8.0
  min_factuality: 9.0
  blocker_policy: hard_fail
  depth:                        # deterministic anti-shallow floor (eval/graders/depth_grader.py)
    min_memo_chars: 1200        # per analyst memo — a 3-sentence stub fails
    min_section_chars: 300      # per report section — flags stub sections
    min_evidence_cards: 12      # total evidence cards collected
    min_exec_bullets: 3         # Executive Summary bullet count

# --- Decision ---
decision:
  enabled: true
  labels: [BUY, HOLD, SELL]
  require_confidence_score: true
  require_risk_section: true
  require_disconfirming_evidence: true
  min_evidence_count: 5
  # Multi-round decision panel: each analyst role casts a ballot
  # (vote + conviction self-rating + hedge overlay) per round; a deterministic
  # convergence grader (eval/graders/panel_convergence_grader.py) decides
  # iterate-vs-exit, with a hard max_rounds cap. enabled:false → legacy single-shot.
  panel:
    enabled: true
    min_rounds: 1                 # never exit before this many rounds
    max_rounds: 3                 # hard cap — auto-exit at the limit
    convergence_threshold: 0.70   # conviction-weighted agreement needed to exit early
    conviction_collapse_ratio: 0.75   # round-over-round total-conviction retention floor; below it an early "converged" exit is suppressed (fake consensus)
    stall_epsilon: 0.05           # |Δ convergence_score| below this (and below threshold) = stalled → exit with unresolved_dissent
    devils_advocate_round: true   # round-1 perfect unanimity holds the panel one round; lowest-conviction role steelmans the opposing case
    overlay_labels: [none, hedge, trim, stop]   # hedge stance, separate from BUY/HOLD/SELL

# --- Report Style ---
report_style:
  daily_layout: dashboard_landscape
  weekly_layout: institutional_portrait
  max_pages_daily: 8
  max_pages_weekly: 12
  include_quant_section: true
  include_decision_page: true

# --- Export ---
export:
  formats: [markdown, json, pdf]
  output_dir: exports
  web:
    default_port: 7860          # port for /mm:dashboard

# --- Memory Layer ---
memory:
  enabled: true
  store_dir: memory
  episodic:
    enabled: true
    max_per_ticker: 90          # ~3 months of daily runs
  semantic:
    enabled: true
    supersede_on_conflict: true
    half_life_days: 180
  procedural:
    enabled: true
    extract_from_review_failures: true
  retrieval:
    top_k: 10
    recency_half_life_days: 30
    min_importance: 0.3

# --- Evaluation ---
eval:
  enabled: true
  run_log: logs/run_log.jsonl
  graders:
    factuality: true
    evidence_coverage: true
    consistency: true
    cost_tracker: true
  cost_estimation:
    fable_input_per_1k: 0.010
    fable_output_per_1k: 0.050
    opus_input_per_1k: 0.005
    opus_output_per_1k: 0.025
    sonnet_input_per_1k: 0.003
    sonnet_output_per_1k: 0.015

# --- Model Routing ---
models:
  default_provider: anthropic
  providers:
    anthropic:
      enabled: true
    openai:
      enabled: false
  stage_routes:
    collection: mm-light
    analysis: mm-standard
    discussion: mm-standard
    review: mm-heavy
    decision: mm-heavy
    writing: mm-standard
